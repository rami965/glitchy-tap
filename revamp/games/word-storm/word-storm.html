<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Storm</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050714;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent browser handling of touch gestures */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #0a0e2a;
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * WORD STORM
 * A complete HTML5 Canvas mobile game.
 */

// --- GAME CONFIGURATION ---
const CANVAS_WIDTH = 400;
const CANVAS_HEIGHT = 680;
const COLUMNS = 5;
const COL_WIDTH = CANVAS_WIDTH / COLUMNS;
const TILE_SIZE = 50;
const DANGER_ZONE_Y = 530 - (5 * TILE_SIZE); // 280
const TRAY_Y_START = 530;

const COLORS = {
    bg: '#0a0e2a',
    cols: ['#00e5ff', '#b84fff', '#00ffb3', '#ff8c00', '#ff4fa3'],
    trayTile: '#ffffff',
    trayBorder: '#ffd700',
    btnSubmitReady: '#00ff73',
    btnSubmitOff: '#555555',
    btnClear: '#ff4444',
    text: '#ffffff',
    danger: 'rgba(255, 0, 0, 0.6)'
};

// --- DICTIONARY ---
// A curated list of ~650 common 3-7 letter English words.
const wordString = "CAT DOG RUN FAST JUMP STORM WATER LIGHT HAND FIRE COLD DARK BLUE MAKE TIME PLAY WORD LIST GAME LOVE HOPE THE AND FOR ARE BUT NOT YOU ALL ANY CAN HAD HER WAS ONE OUR OUT DAY GET HAS HIM HIS HOW MAN NEW NOW OLD SEE TWO WAY WHO BOY DID ITS LET PUT SAY SHE TOO USE DAD MOM RED SUN CAR HAT BAT RAT MAT SIT FIT HIT BIT LIT FIN WIN BIN PIN TIN DAN FAN PAN RAN TAN VAN CAP MAP NAP TAP SAP LAP GAP YAP FAT PAT SAT VAT TAT RAW SAW LAW JAW PAW MAW CAW DAW FAW COW VOW BOW SOW ROW TOW LOW MOW WOW BUG HUG JUG MUG PUG RUG TUG DUG FUG LUG FOG LOG BOG COG HOG JOG NOG TOG WOG MAY PAY RAY HAY LAY JAY NAY BAY FAY GAY SEA PEA TEA BEE FEE KEE LEE NEE VEE GEE TREE FREE THREE KNEE FLEE GLEE PLEA FLEA CREE SKI FLY SLY PLY CRY DRY FRY PRY TRY WRY WHY SHY THY BUY GUY ACT ADD AGE AGO AIR ICE ILL INK ION JOB JOY KEY KID KIN LIP MAD NET NUT OAK OIL OWL PIG PEN PET POP ROB RUB SAD SET SIN SKY SON TAX TEN TOP TOY WAR WEB WET WIN YES YET ZOO ABLE ALSO AWAY BACK BALL BEAR BEAT BIRD BOAT BOOK BOTH CALL CAME CARE CITY CLUB COME COPY COST DARK DEEP DOOR DOWN DRAW DROP EAST EASY EDGE EVEN EVER EYED FACE FACT FAIR FALL FARM FAST FEAR FEEL FILL FIND FINE FIRE FISH FIVE FLAT FOOD FOOT FORM FOUR FREE FROM FULL GAME GIRL GIVE GLAD GOOD GREW GROW HAIR HALF HALL HAND HARD HEAD HEAR HEAT HELP HERE HIGH HILL HOLD HOME HOPE HOUR IDEA IRON JUST KEEP KIND KNEW KNOW LAND LAST LATE LEFT LESS LIFE LINE LONG LOOK LOST LOTS MAIN MANY MARK MEAN MEAT MIND MISS MOON MORE MOST MOVE MUCH MUST NAME NEAR NEED NEXT NINE NOTE ONCE OPEN OVER PAGE PART PAST PATH PLAN PLAY POOR PORT PULL PUSH RACE RAIN READ REAL REST RICH RIDE RING RISE ROAD ROCK ROOM RULE SAFE SAIL SAME SAVE SEED SEEM SELF SEND SHIP SHOW SIDE SIGN SIZE SKIN SLIP SLOW SNOW SOFT SOME SONG SOON STAR STAY STEP STOP SUCH SURE TAKE TALK TALL TASK TELL TENT TEST THAN THAT THEM THEN THEY THIS THUS TILL TIME TOLD TOOK TOWN TREE TRUE TURN TYPE UPON VERY VIEW WAIT WALK WALL WANT WARM WASH WELL WENT WERE WHAT WHEN WIDE WIFE WILD WILL WIND WING WIRE WITH WOOD WORD WORK YEAR YOUR APPLE ABOUT ABOVE AFTER AGAIN ALONE ANIMAL ANSWER AROUND BEGAN BEGIN BEING BELOW BLACK BRING BROWN BUILD CARRY CAUSE CHECK CHILD CLASS CLEAR CLOSE COLOR COULD COVER CROSS DANCE DRIVE EARTH EMPTY ENJOY ENTER EVENT EXACT EXTRA FIELD FINAL FIRST FLOOR FORCE FOUND FRESH FRONT GLASS GREAT GREEN GROUP GUARD GUESS HAPPY HEAVY HORSE HOUSE HUMAN LARGE LATER LEARN LEAVE LIGHT LOCAL MATCH MIGHT MONEY MONTH MORNING MOTHER NEVER NIGHT NOISE NORTH OCEAN OFTEN ORDER OTHER PAPER PEACE PIECE PLACE POINT POUND POWER PRESS PRICE PROUD QUICK QUIET QUITE REACH READY RIGHT RIVER ROUND SCALE SCENE SENSE SERVE SHAPE SHARE SHORT SIGHT SMALL SMART SMILE SOUND SOUTH SPACE SPEAK SPEED SPELL SPEND SPOKE STAND START STATE STILL STONE STORY STUDY SUGAR SWEET TABLE TEACH THEIR THERE THESE THING THINK THOSE THREE TODAY TOUCH TRACK TRAIN UNDER UNTIL USUAL VALUE VOICE WATCH WATER WHERE WHICH WHILE WHITE WHOLE WOMAN WORLD WOULD WRITE YOUNG";
const DICTIONARY = new Set(wordString.split(" "));

// --- LETTER POOL & LOGIC ---
const LETTER_WEIGHTS = {
    'E':4,'T':4,'A':4,'O':4,'I':4,'N':4,'S':4,'R':4,'H':4,'L':4,
    'D':2,'C':2,'U':2,'M':2,'F':2,'P':2,'G':2,'W':2,'Y':2,'B':2,
    'V':1,'K':1,'J':1,'X':1,'Q':1,'Z':1
};
let letterPool = [];
for (let char in LETTER_WEIGHTS) {
    for (let i = 0; i < LETTER_WEIGHTS[char]; i++) {
        letterPool.push(char);
    }
}

// --- GLOBALS ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let bestScore = localStorage.getItem('wordStormBest') || 0;
let lives = 3;
let combo = 1;
let level = 1;

let activeLetters = [];
let trayLetters = [];
let particles = [];
let floatingTexts = [];
let stars = [];

let gameTimer = 0;
let lastSpawnTime = 0;
let speedIncreaseTime = 0;
let queuedUColumn = -1;
let currentSpeed = 1; // Pixels per frame
let spawnRate = 1200; // ms
let trayShake = 0;
let screenFlash = 0; // For damage

// Buttons mapping
const BUTTONS = {
    clear:  { x: 20,  y: 610, w: 170, h: 60 },
    submit: { x: 210, y: 610, w: 170, h: 60 }
};

// --- CLASSES ---
class Letter {
    constructor(col, char, isU = false) {
        this.col = col;
        this.char = char;
        this.w = TILE_SIZE;
        this.h = TILE_SIZE;
        this.x = (col * COL_WIDTH) + (COL_WIDTH / 2);
        this.y = -TILE_SIZE;
        this.color = COLORS.cols[col];
        this.state = 'falling'; // falling, stacked
        this.pulse = 0;
        this.isU = isU; // Special flag if forced by Q
    }

    update() {
        if (this.state === 'falling') {
            this.y += currentSpeed;
            // Check stacking collision
            let stackTopY = TRAY_Y_START;
            for (let other of activeLetters) {
                if (other !== this && other.col === this.col && other.state === 'stacked') {
                    if (other.y < stackTopY) stackTopY = other.y;
                }
            }
            if (this.y + (this.h / 2) >= stackTopY - (this.h / 2)) {
                this.y = stackTopY - this.h;
                this.state = 'stacked';
                checkDangerZone();
            }
        }
        if (this.pulse > 0) this.pulse -= 0.1;
    }

    draw(ctx) {
        let drawX = this.x;
        let drawY = this.y;
        let scale = 1 + this.pulse;

        ctx.save();
        ctx.translate(drawX, drawY);
        ctx.scale(scale, scale);

        ctx.beginPath();
        ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 8);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow for text

        // Text
        ctx.fillStyle = COLORS.text;
        ctx.font = 'bold 24px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.char, 0, 2);
        
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 12;
        this.vy = (Math.random() - 0.5) * 12;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.02;
        this.size = Math.random() * 5 + 3;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class FloatingText {
    constructor(x, y, text, color, isCombo) {
        this.x = x; this.y = y;
        this.text = text;
        this.color = color;
        this.vy = -1.5;
        this.life = 1;
        this.decay = 0.015;
        this.size = isCombo ? 24 : 18;
    }
    update() {
        this.y += this.vy;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = `bold ${this.size}px "Segoe UI", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

// --- SETUP ---
function init() {
    canvas.width = CANVAS_WIDTH * dpr;
    canvas.height = CANVAS_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.width = CANVAS_WIDTH + 'px';
    canvas.style.height = CANVAS_HEIGHT + 'px';

    // Init Stars
    for(let i=0; i<30; i++) {
        stars.push({
            x: Math.random() * CANVAS_WIDTH,
            y: Math.random() * CANVAS_HEIGHT,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.1,
            alpha: Math.random() * 0.5 + 0.1
        });
    }

    // Event Listeners
    canvas.addEventListener('pointerdown', handleInput);
    
    // Start Loop
    requestAnimationFrame(gameLoop);
}

function resetGame() {
    score = 0;
    lives = 3;
    combo = 1;
    level = 1;
    currentSpeed = 0.8;
    spawnRate = 1200;
    activeLetters = [];
    trayLetters = [];
    particles = [];
    floatingTexts = [];
    queuedUColumn = -1;
    gameTimer = 0;
    lastSpawnTime = performance.now();
    speedIncreaseTime = performance.now();
    gameState = 'PLAYING';
}

// --- CORE LOGIC ---
function spawnLetter(timestamp) {
    if (timestamp - lastSpawnTime > spawnRate) {
        let col;
        let char;

        if (queuedUColumn !== -1) {
            col = queuedUColumn;
            char = 'U';
            queuedUColumn = -1;
        } else {
            col = Math.floor(Math.random() * COLUMNS);
            
            // Prevent 3+ same letters across board
            let attempts = 0;
            do {
                char = letterPool[Math.floor(Math.random() * letterPool.length)];
                attempts++;
            } while (countChar(char) >= 2 && attempts < 5);

            if (char === 'Q') queuedUColumn = col;
        }

        activeLetters.push(new Letter(col, char, char==='U'));
        lastSpawnTime = timestamp;
    }
}

function countChar(char) {
    let count = 0;
    activeLetters.forEach(l => { if(l.char === char) count++; });
    trayLetters.forEach(l => { if(l.char === char) count++; });
    return count;
}

function checkDangerZone() {
    // Check if any column has 5 stacked letters
    let colCounts = [0,0,0,0,0];
    activeLetters.forEach(l => {
        if (l.state === 'stacked') {
            colCounts[l.col]++;
        }
    });

    for (let c = 0; c < COLUMNS; c++) {
        if (colCounts[c] >= 5) {
            loseLife();
            break;
        }
    }
}

function loseLife() {
    lives--;
    screenFlash = 1;
    combo = 1; // Reset combo
    floatingTexts.push(new FloatingText(CANVAS_WIDTH/2, CANVAS_HEIGHT/2, "LIFE LOST!", COLORS.btnClear, true));
    
    // Clear the board to recover
    activeLetters = [];
    trayLetters = []; // Return tray too
    
    if (lives <= 0) {
        gameState = 'GAMEOVER';
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('wordStormBest', bestScore);
        }
    }
}

function handleInput(e) {
    e.preventDefault();
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
        return;
    }
    
    if (gameState !== 'PLAYING') return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_WIDTH / rect.width;
    const scaleY = CANVAS_HEIGHT / rect.height;
    
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    // Check UI Buttons First
    if (y > 600) {
        if (x > BUTTONS.clear.x && x < BUTTONS.clear.x + BUTTONS.clear.w && 
            y > BUTTONS.clear.y && y < BUTTONS.clear.y + BUTTONS.clear.h) {
            clearTray();
            return;
        }
        if (x > BUTTONS.submit.x && x < BUTTONS.submit.x + BUTTONS.submit.w && 
            y > BUTTONS.submit.y && y < BUTTONS.submit.y + BUTTONS.submit.h) {
            if (trayLetters.length >= 3) submitWord();
            return;
        }
    }

    // Check Letters (Backwards to get top-most first)
    for (let i = activeLetters.length - 1; i >= 0; i--) {
        let l = activeLetters[i];
        if (Math.abs(x - l.x) < l.w/2 + 5 && Math.abs(y - l.y) < l.h/2 + 5) {
            if (trayLetters.length < 7) {
                l.pulse = 0.5;
                selectLetter(l, i);
            }
            break;
        }
    }
}

function selectLetter(letter, index) {
    activeLetters.splice(index, 1);
    trayLetters.push(letter);
    
    // Make stacked letters above it fall down (Gravity)
    activeLetters.forEach(l => {
        if (l.state === 'stacked' && l.col === letter.col && l.y < letter.y) {
            l.state = 'falling';
        }
    });
}

function clearTray() {
    // Put letters back as falling from top randomly
    trayLetters.forEach(l => {
        l.state = 'falling';
        l.y = -TILE_SIZE - (Math.random() * 50);
        l.pulse = 0;
        activeLetters.push(l);
    });
    trayLetters = [];
}

function submitWord() {
    const word = trayLetters.map(l => l.char).join("");
    
    if (DICTIONARY.has(word)) {
        // Valid Word
        let basePoints = 0;
        if (word.length === 3) basePoints = 10;
        else if (word.length === 4) basePoints = 25;
        else if (word.length === 5) basePoints = 50;
        else basePoints = 100;

        let multiplier = 1;
        if (combo === 2) multiplier = 1.5;
        else if (combo >= 3) multiplier = 2; // Cap at 2x visually, or 3x? "3x (max)" from prompt
        if (combo > 3) multiplier = 3;

        let points = Math.floor(basePoints * multiplier);
        score += points;

        // Visuals
        trayLetters.forEach((l, i) => {
            // Spawn particles matching letter original column color
            let trayX = (CANVAS_WIDTH / 2) - ((trayLetters.length * 55) / 2) + (i * 55) + 27;
            let trayY = 565;
            for(let p=0; p<15; p++) {
                particles.push(new Particle(trayX, trayY, l.color));
            }
        });

        floatingTexts.push(new FloatingText(CANVAS_WIDTH/2, 530, `+${points}`, '#00ff73', false));
        if (multiplier > 1) {
            floatingTexts.push(new FloatingText(CANVAS_WIDTH/2, 500, `${multiplier}x COMBO!`, '#ffd700', true));
        }

        combo++;
        trayLetters = []; // Destroy them
    } else {
        // Invalid
        trayShake = 20;
        combo = 1; // Reset combo
        floatingTexts.push(new FloatingText(CANVAS_WIDTH/2, 530, "INVALID", '#ff4444', false));
        clearTray();
    }
}

// --- UPDATE & DRAW ---
function update(timestamp) {
    if (gameState !== 'PLAYING') return;

    // Speed increase every 30s
    if (timestamp - speedIncreaseTime > 30000) {
        level++;
        currentSpeed *= 1.2;
        spawnRate *= 0.85;
        speedIncreaseTime = timestamp;
        floatingTexts.push(new FloatingText(CANVAS_WIDTH/2, 100, "SPEED UP!", COLORS.cols[0], true));
    }

    spawnLetter(timestamp);

    activeLetters.forEach(l => l.update());
    
    // Background Stars
    stars.forEach(s => {
        s.y -= s.speed;
        if (s.y < 0) s.y = CANVAS_HEIGHT;
    });

    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(t => t.update());
    floatingTexts = floatingTexts.filter(t => t.life > 0);

    if (trayShake > 0) trayShake *= 0.8;
    if (trayShake < 0.5) trayShake = 0;

    if (screenFlash > 0) screenFlash -= 0.05;
}

function draw() {
    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Stars
    stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });

    if (gameState === 'START') {
        drawStartScreen();
        return;
    } else if (gameState === 'GAMEOVER') {
        drawGameOverScreen();
        return;
    }

    // --- PLAYING STATE ---

    // Top Bar (Score, Lives, Level)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, 50);
    
    ctx.fillStyle = COLORS.text;
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 25);
    
    ctx.textAlign = 'right';
    ctx.fillText(`LVL: ${level}`, CANVAS_WIDTH - 10, 25);

    // Lives
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4fa3';
    let hearts = "";
    for(let i=0; i<lives; i++) hearts += "♥ ";
    ctx.fillText(hearts.trim(), CANVAS_WIDTH/2, 25);

    // Danger Line
    ctx.beginPath();
    ctx.moveTo(0, DANGER_ZONE_Y);
    ctx.lineTo(CANVAS_WIDTH, DANGER_ZONE_Y);
    ctx.strokeStyle = COLORS.danger;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.stroke();
    ctx.setLineDash([]); // Reset

    // Draw Falling/Stacked Letters
    activeLetters.forEach(l => l.draw(ctx));

    // Tray Area Background
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, TRAY_Y_START, CANVAS_WIDTH, 70);

    // Draw Tray Letters
    ctx.save();
    let shakeOffset = Math.sin(performance.now() / 30) * trayShake;
    ctx.translate(shakeOffset, 0);
    
    let totalTrayWidth = trayLetters.length * 55;
    let startX = (CANVAS_WIDTH / 2) - (totalTrayWidth / 2) + 27; // +27 half of 55 approx
    
    trayLetters.forEach((l, i) => {
        let drawX = startX + (i * 55);
        let drawY = TRAY_Y_START + 35;
        
        ctx.save();
        ctx.translate(drawX, drawY);
        ctx.beginPath();
        ctx.roundRect(-22, -22, 44, 44, 6);
        ctx.fillStyle = COLORS.trayTile;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = COLORS.trayBorder;
        ctx.stroke();
        
        ctx.fillStyle = '#000';
        ctx.font = 'bold 24px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(l.char, 0, 2);
        ctx.restore();
    });
    ctx.restore();

    // Buttons
    // Clear
    ctx.fillStyle = COLORS.btnClear;
    ctx.beginPath();
    ctx.roundRect(BUTTONS.clear.x, BUTTONS.clear.y, BUTTONS.clear.w, BUTTONS.clear.h, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.fillText("CLEAR", BUTTONS.clear.x + BUTTONS.clear.w/2, BUTTONS.clear.y + BUTTONS.clear.h/2 + 2);

    // Submit
    let submitReady = trayLetters.length >= 3;
    ctx.fillStyle = submitReady ? COLORS.btnSubmitReady : COLORS.btnSubmitOff;
    if (submitReady) {
        ctx.shadowColor = COLORS.btnSubmitReady;
        ctx.shadowBlur = 15;
    }
    ctx.beginPath();
    ctx.roundRect(BUTTONS.submit.x, BUTTONS.submit.y, BUTTONS.submit.w, BUTTONS.submit.h, 10);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = submitReady ? '#000' : '#aaa';
    ctx.fillText("SUBMIT ▶", BUTTONS.submit.x + BUTTONS.submit.w/2, BUTTONS.submit.y + BUTTONS.submit.h/2 + 2);

    // Particles & Texts
    particles.forEach(p => p.draw(ctx));
    floatingTexts.forEach(t => t.draw(ctx));

    // Screen Flash (Damage)
    if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${screenFlash * 0.4})`;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    
    // Lightning Bolt Custom Drawing
    ctx.save();
    ctx.translate(CANVAS_WIDTH/2, 200);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ff8c00';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(-10, -50);
    ctx.lineTo(20, -10);
    ctx.lineTo(0, 0);
    ctx.lineTo(15, 50);
    ctx.lineTo(-25, 5);
    ctx.lineTo(-5, -5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.font = 'bold 48px "Segoe UI", sans-serif';
    ctx.fillText("WORD STORM", CANVAS_WIDTH/2, 300);
    
    ctx.font = '20px "Segoe UI", sans-serif';
    ctx.fillStyle = '#00e5ff';
    ctx.fillText("Spell fast. Score big.", CANVAS_WIDTH/2, 340);

    ctx.fillStyle = '#aaa';
    ctx.fillText(`BEST SCORE: ${bestScore}`, CANVAS_WIDTH/2, 400);

    // Play Button
    ctx.fillStyle = COLORS.btnSubmitReady;
    ctx.shadowColor = COLORS.btnSubmitReady;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.roundRect(100, 480, 200, 60, 30);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText("PLAY", CANVAS_WIDTH/2, 512);
}

function drawGameOverScreen() {
    // Red Vignette
    let grad = ctx.createRadialGradient(CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 50, CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 400);
    grad.addColorStop(0, 'rgba(0,0,0,0.8)');
    grad.addColorStop(1, 'rgba(255,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.font = 'bold 50px "Segoe UI", sans-serif';
    ctx.fillText("GAME OVER", CANVAS_WIDTH/2, 250);

    ctx.font = '30px "Segoe UI", sans-serif';
    ctx.fillText(`SCORE: ${score}`, CANVAS_WIDTH/2, 330);
    
    ctx.font = '20px "Segoe UI", sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`BEST SCORE: ${bestScore}`, CANVAS_WIDTH/2, 380);

    // Play Again Button
    ctx.fillStyle = COLORS.cols[2];
    ctx.shadowColor = COLORS.cols[2];
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.roundRect(100, 480, 200, 60, 30);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.fillText("PLAY AGAIN", CANVAS_WIDTH/2, 512);
}

function gameLoop(timestamp) {
    update(timestamp);
    draw();
    requestAnimationFrame(gameLoop);
}

// Start everything
init();

</script>
</body>
</html>
